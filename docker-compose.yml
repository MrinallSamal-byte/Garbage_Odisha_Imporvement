version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: safa-odisha-db
    environment:
      POSTGRES_DB: safa_odisha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safa-odisha-app
    depends_on:
      - db
    environment:
      NODE_ENV: production
      APP_MODE: real
      DATABASE_URL: postgresql://postgres:postgres@db:5432/safa_odisha
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_DIR: public/uploads
      GEOCODER_PROVIDER: mock
      AI_PROVIDER: mock
      OPENROUTER_MODEL: google/gemma-4-31b-it:free
      ADMIN_EMAIL: admin@safaodisha.local
      ADMIN_PASSWORD: ChangeThis123!
      ADMIN_SESSION_SECRET: replace-with-a-32-character-secret
      PREVIEW_TOKEN_SECRET: replace-with-a-32-character-secret
      MAX_UPLOAD_MB: 8
      GPS_ACCURACY_WARN_THRESHOLD: 35
      GPS_ACCURACY_BLOCK_THRESHOLD: 150
      RATE_LIMIT_ANALYZE_PER_HOUR: 25
      RATE_LIMIT_SUBMIT_PER_HOUR: 15
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  postgres-data:
